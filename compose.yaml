services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: vpsrent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
      POSTGRES_DB: vpsrent
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpsrent -d vpsrent"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
